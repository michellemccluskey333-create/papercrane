<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperCrane Books & Tattoo</title>
  <style>
    :root {
      --paper: #efe2c6;
      --paper-deep: #d8c39d;
      --ink: #17120e;
      --muted: #6f5d48;
      --gold: #b7863c;
      --red: #9e241f;
      --green: #55612f;
      --purple: #6d3f78;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at center top, rgba(255,255,255,.55), transparent 36%),
        radial-gradient(circle at 15% 20%, rgba(183,134,60,.18), transparent 22%),
        linear-gradient(135deg, #f5ead5, var(--paper) 48%, #dbc6a4);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(23,18,14,.12) 1px, transparent 1px),
        radial-gradient(rgba(23,18,14,.08) 1px, transparent 1px);
      background-size: 27px 27px, 11px 11px;
      opacity: .22;
      mix-blend-mode: multiply;
    }

.entry {
  height: 100vh;
  max-height: 100vh;
  display: grid;
  grid-template-rows: 44vh 4vh 52vh;
  justify-items: center;
  align-items: start;
  padding: 1.5vh 3vw 1vh;
  overflow: hidden;
}

    .crane {
    width: 86px;
    height: 66px;
    margin-bottom: 18px;
    animation: craneLand 1.9s cubic-bezier(.2,.9,.2,1) both;
    transform-origin: center;
    }

.logo-stack {
  position: relative;
  width: min(920px, 64vw, 58vh);
  margin: -2.2vh auto 0;
  z-index: 5;
}


 .logo-base {
  width: 100%;
  display: block;
  position: relative;
  z-index: 1;
}

.logo-crane {
  position: absolute;
  width: 58%;
  top: 2%;
  left: 24%;
  z-index: 2;
  transform-origin: 50% 55%;
  animation: craneSpinLand 4.5s cubic-bezier(.18,.85,.22,1) forwards;
}


@keyframes craneSpinLand {
  0% {
    opacity: 0;
    transform:
      translate(0vw, 0vh)
      rotate(0deg)
      scale(5);
  }

  10% {
    opacity: 1;
  }

  100% {
    opacity: 1;
    transform:
      translate(0, 0)
      rotate(1800deg)
      scale(1);
  }
}
    .brand {
      text-align: center;
      animation: fadeUp .9s ease both;
      animation-delay: 1.15s;
    }

    .brand h1 {
      font-size: clamp(3.1rem, 9vw, 7.5rem);
      letter-spacing: .16em;
      font-weight: 400;
      line-height: .9;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    .brand .sub {
      margin-top: 18px;
      color: #7f1d1a;
      font-family: Arial, sans-serif;
      letter-spacing: .48em;
      text-transform: uppercase;
      font-size: clamp(.8rem, 1.5vw, 1.08rem);
    }

    .rule {
      width: min(560px, 78vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 22px auto 18px;
      position: relative;
    }

.tagline {
  font-family: Arial, sans-serif;
  text-transform: uppercase;
  letter-spacing: .42em;
  font-size: clamp(.62rem, 1vw, .9rem);
  color: #2a211a;
  margin: 0;
  animation: fadeUp .9s ease both;
  animation-delay: 4.7s;
}

.doors {
  width: min(1080px, 90vw);
  height: 100%;
  display: grid;
  grid-template-columns: 1fr .82fr 1fr;
  grid-template-areas: "tattoo book studio";
  gap: 1vw;
  align-items: end;
  justify-items: center;
  margin: -4vh 0 0;
  animation: fadeUp .9s ease both;
  animation-delay: 3.7s;
}

.door {
  position: relative;
  display: block;
  width: 100%;
  background: rgba(255,248,232,.34);
  border: 2px solid rgba(23,18,14,.78);
  text-decoration: none;
  overflow: hidden;
  clip-path: polygon(
    0 18px,
    18px 0,
    calc(100% - 18px) 0,
    100% 18px,
    100% calc(100% - 18px),
    calc(100% - 18px) 100%,
    18px 100%,
    0 calc(100% - 18px)
  );
}

.door::before {
  content: "✦";
  position: absolute;
  top: 78px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--accent);
  font-size: 1.2rem;
  opacity: .75;
  pointer-events: none;
}


.door::after {
  content: "";
  position: absolute;
  width: 150px;
  height: 92px;
  top: 42px;
  left: 50%;
  transform: translateX(-50%) rotate(-4deg);
  opacity: 0;
  z-index: 0;
  border-radius: 48% 42% 46% 40%;
  filter: saturate(.9);
  transition: opacity .35s ease;
}

.door:hover::after {
  opacity: .82;
}

   .door img,
.door h2,
.door p,
.door span,
.door div {
  position: relative;
  z-index: 1;
}
.door-art {
  position: absolute;
  width: 62%;
  top: 16%;
  left: 50%;
  transform: translateX(-50%) rotate(-18deg);
  z-index: 2;
  pointer-events: none;
  filter: grayscale(.15) drop-shadow(0 14px 16px rgba(23,18,14,.22));
  transition: filter .35s ease, transform .35s ease;
}

.door:hover .door-art {
  filter:
    grayscale(0)
    drop-shadow(0 18px 22px rgba(23,18,14,.28));
}

.tattoo-art {
  width: 42%;
  top: 6%;
  left: 46%;
  transform:
    translateX(-50%)
    rotate(34deg);
}
    .door:hover {
      transform: translateY(-8px);
      background: rgba(255,248,232,.62);
    }

.door.tattoo {
  grid-area: tattoo;
  height: min(43vh, 390px);
  --accent: var(--red);
}

.door.book {
  grid-area: book;
  height: min(35vh, 320px);
  --accent: var(--green);
}

.door.studio {
  grid-area: studio;
  height: min(43vh, 390px);
  --accent: var(--purple);
}

    .door.tattoo::after { background: var(--red); }
    .door.book::after { background: var(--green); }
    .door.studio::after { background: var(--purple); }

    .door.tattoo:hover {
      border-color: var(--red);
      box-shadow: 0 0 22px rgba(158,36,31,.55), 0 22px 60px rgba(42, 28, 16, .18);
    }

    .door.tattoo:hover::before {
      opacity: 1;
      background: radial-gradient(circle at center 28%, rgba(158,36,31,.22), transparent 46%);
      animation: neonFlicker 1.2s infinite alternate;
    }

    .door.book:hover {
      border-color: var(--green);
      box-shadow: 0 0 20px rgba(85,97,47,.44), 0 22px 60px rgba(42, 28, 16, .18);
    }

    .door.book:hover::before {
      opacity: 1;
      background: radial-gradient(circle at center 28%, rgba(183,134,60,.25), transparent 48%);
    }

    .door.studio:hover {
      border-color: var(--purple);
      box-shadow: 0 0 20px rgba(109,63,120,.48), 0 22px 60px rgba(42, 28, 16, .18);
    }

    .door.studio:hover::before {
      opacity: 1;
      background: radial-gradient(circle at center 28%, rgba(109,63,120,.22), transparent 48%);
    }

    @keyframes neonFlicker {
      0%, 100% { opacity: .72; }
      45% { opacity: .95; }
      52% { opacity: .58; }
      58% { opacity: 1; }
    }

.icon {
  width: clamp(72px, 6vw, 118px);
  height: clamp(72px, 6vw, 118px);
  margin-bottom: 1.2vh;
}
.door.book .icon {
  width: 126px;
  height: 126px;
}
    .door:hover .icon {
      transform: scale(1.06) rotate(-2deg);
      filter: drop-shadow(0 0 8px var(--accent));
    }

 .door h2 {
  font-size: clamp(1.3rem, 2vw, 2.2rem);
}

 .copy {
  margin-top: 1.2vh;
  font-size: clamp(.78rem, .9vw, .98rem);
  line-height: 1.55;
}

.enter {
  min-width: unset;
  width: 82%;
  padding: 10px 12px;
  font-size: .78rem;
}

.door:hover .enter {
  letter-spacing: .34em;
  transform: translateY(-2px);
}
    .book-art {
  width: 60%;
  top: 16%;
  left: 50%;
  transform: translateX(-50%);
}

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

@media (max-width: 900px) {
  .entry {
    height: auto;
    min-height: 100vh;
    overflow: visible;
    padding: 28px 18px 42px;
  }

  .logo-stack {
    width: min(340px, 82vw);
    margin-bottom: 12px;
  }

  .doors {
    grid-template-columns: 1fr;
    max-height: none;
    gap: 18px;
    margin-top: 24px;
  }

  .door,
  .door.book {
    height: auto;
    transform: none;
  }
}
  </style>
</head>
