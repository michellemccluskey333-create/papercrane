<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperCrane Books & Tattoo</title>
  <style>
    :root {
      --paper: #efe2c6;
      --paper-deep: #d8c39d;
      --ink: #17120e;
      --muted: #6f5d48;
      --gold: #b7863c;
      --red: #9e241f;
      --green: #55612f;
      --purple: #6d3f78;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

body {
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  color: #efe3c7;

  background: #050505;

  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(rgba(255,238,198,.08) 1px, transparent 1px);
  background-size: 18px 18px;
  opacity: .16;
  mix-blend-mode: screen;
}

.entry {
  height: 100vh;
  max-height: 100vh;
  display: grid;
  grid-template-rows: 44vh 4vh 52vh;
  justify-items: center;
  align-items: start;
  padding: 1.5vh 3vw 1vh;
  overflow: visible;
}

    .crane {
    width: 86px;
    height: 66px;
    margin-bottom: 18px;
    animation: craneLand 1.9s cubic-bezier(.2,.9,.2,1) both;
    transform-origin: center;
    }

.logo-stack {
  position: relative;
  width: min(920px, 64vw, 58vh);
  margin: -2.2vh auto 0;
  z-index: 5;
}


 .logo-base {
  width: 100%;
  display: block;
  position: relative;
  z-index: 1;
}

.logo-crane {
  position: absolute;
  width: 58%;
  top: 2%;
  left: 26%;
  z-index: 2;
  transform-origin: 50% 55%;
  animation: craneSpinLand 4.5s cubic-bezier(.18,.85,.22,1) forwards;
}


@keyframes craneSpinLand {
  0% {
    opacity: 0;
    transform:
      translate(0vw, 0vh)
      rotate(0deg)
      scale(5);
  }

  35% {
    opacity: .35;
  }

  70% {
    opacity: .85;
  }

  100% {
    opacity: 1;
    transform:
      translate(0, 0)
      rotate(1800deg)
      scale(1);
  }
}
    .brand {
      text-align: center;
      animation: fadeUp .9s ease both;
      animation-delay: 1.15s;
    }

    .brand h1 {
      font-size: clamp(3.1rem, 9vw, 7.5rem);
      letter-spacing: .16em;
      font-weight: 400;
      line-height: .9;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    .brand .sub {
      margin-top: 18px;
      color: #7f1d1a;
      font-family: Arial, sans-serif;
      letter-spacing: .48em;
      text-transform: uppercase;
      font-size: clamp(.8rem, 1.5vw, 1.08rem);
    }

    .rule {
      width: min(560px, 78vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 22px auto 18px;
      position: relative;
    }

.tagline {
  font-family: Arial, sans-serif;
  text-transform: uppercase;
  letter-spacing: .42em;
  font-size: clamp(.62rem, 1vw, .9rem);
  color: #2a211a;
  margin: 0;
  animation: fadeUp .9s ease both;
  animation-delay: 4.7s;
}

/* =========================================================
   DOOR LAYOUT
   Goal:
   - keep the three-door composition
   - give shadows room to breathe
   - prevent clipping
========================================================= */

.doors {
  width: min(1120px, 90vw);
  height: 100%;
  display: grid;

  /* outer doors wider, center door slightly smaller */
  grid-template-columns: minmax(240px, 320px) minmax(230px, 300px) minmax(240px, 320px);
  grid-template-areas: "tattoo book studio";

  justify-content: space-between;
  align-items: end;
  justify-items: center;

  gap: clamp(36px, 4vw, 72px);
  margin: -4vh 0 0;

  /* gives the smoky shadows room below */
  padding-bottom: 10vh;

  /* critical: never clip outside shadows */
  overflow: visible;

  animation: fadeUp .9s ease both;
  animation-delay: 3.7s;
}


/* =========================================================
   OUTSIDE SHADOW WRAPPER
   This is what creates the smoky shadow on the page background.
   The shadow is NOT on the door itself.
========================================================= */

.door-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: visible;
  isolation: isolate;
}

/* SOFT HALO AROUND THE WHOLE PLAQUE
   This creates the smoky side shadow from the reference image. */
.door-wrap::before {
  content: "";
  position: absolute;

  left: 50%;
  top: 52%;

  width: 128%;
  height: 116%;

  transform: translate(-50%, -50%);

  background:
    radial-gradient(
      ellipse at center,
      rgba(23,18,14,.30) 0%,
      rgba(23,18,14,.22) 28%,
      rgba(23,18,14,.12) 50%,
      rgba(23,18,14,.06) 66%,
      transparent 82%
    );

  filter: blur(34px);
  border-radius: 50%;

  z-index: 0;
  pointer-events: none;
}

/* HEAVIER BOTTOM CONTACT SHADOW
   This is the darker shadow right under the frame. */
.door-wrap::after {
  content: "";
  position: absolute;

  left: 50%;
  bottom: -38px;

  width: 112%;
  height: 26%;

  transform: translateX(-50%);

  background:
    radial-gradient(
      ellipse at center,
      rgba(23,18,14,.58) 0%,
      rgba(23,18,14,.38) 34%,
      rgba(23,18,14,.18) 60%,
      transparent 84%
    );

  filter: blur(24px);
  border-radius: 50%;

  z-index: 0;
  pointer-events: none;
}
    /* SIDE SHADOW BLOOM — makes the plaque feel raised off the page */
.door-wrap .door-shadow-side {
  display: none;
}

/* =========================================================
   PHYSICAL BEVELED DOOR / PLAQUE
   This is the actual visible frame.
   Outside shadow comes from .door-wrap, not here.
========================================================= */

.door {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;

  overflow: hidden;
  text-decoration: none;
  isolation: isolate;
  z-index: 1;

  /* closed mitered rectangle */
  clip-path: polygon(
    24px 0,
    calc(100% - 24px) 0,
    100% 24px,
    100% calc(100% - 24px),
    calc(100% - 24px) 100%,
    24px 100%,
    0 calc(100% - 24px),
    0 24px
  );

  /* warm carved frame base */
  background:
    linear-gradient(135deg, rgba(255,255,255,.58), transparent 34%),
    linear-gradient(315deg, rgba(48,35,22,.26), transparent 34%),
    linear-gradient(
      to bottom,
      rgba(226,210,178,.98),
      rgba(188,164,125,.98)
    );

  /* softer frame depth — fewer hard stripes */
  box-shadow:
    inset 0 0 0 2px rgba(20,17,13,.72),
    inset 0 0 0 9px rgba(255,242,214,.42),
    inset 0 0 0 12px rgba(64,47,31,.42),
    inset 0 0 0 21px rgba(205,181,140,.50),
    inset 0 0 0 24px rgba(38,28,19,.42),
    inset 0 0 48px rgba(54,38,22,.16);

  transition:
    transform .35s ease,
    box-shadow .35s ease;
}
/* =========================================================
   SOFT TOP FRAME DETAIL
   Adds illustrated linework without making the frame look striped.
========================================================= */

.door::after {
  content: "";
  position: absolute;
  inset: 8px;
  z-index: 5;
  pointer-events: none;

  clip-path: polygon(
    19px 0,
    calc(100% - 19px) 0,
    100% 19px,
    100% calc(100% - 19px),
    calc(100% - 19px) 100%,
    19px 100%,
    0 calc(100% - 19px),
    0 19px
  );

  box-shadow:
    inset 0 0 0 1px rgba(18,14,10,.42),
    inset 0 0 0 7px rgba(255,250,236,.20),
    inset 0 0 0 8px rgba(18,14,10,.20),
    inset 0 -14px 18px rgba(23,18,14,.08),
    inset 0 10px 14px rgba(255,255,255,.15);
}

    /* =========================================================
   WATERCOLOR / INK WASH
   This is now a real layer inside the door,
   not attached to the frame itself.
========================================================= */

.door-wash {
  position: absolute;
  width: 64%;
  aspect-ratio: 1.45 / 1;
  top: 18%;
  left: 50%;
  transform: translateX(-50%) rotate(-8deg);
  z-index: 1;
  pointer-events: none;
  opacity: .74;

  background:
    radial-gradient(circle at 22% 46%, rgba(158,36,31,.30) 0 7px, transparent 9px),
    radial-gradient(circle at 36% 31%, rgba(158,36,31,.22) 0 4px, transparent 6px),
    radial-gradient(circle at 58% 40%, rgba(158,36,31,.28) 0 8px, transparent 11px),
    radial-gradient(circle at 72% 58%, rgba(158,36,31,.20) 0 5px, transparent 7px),
    radial-gradient(circle at 44% 55%, rgba(158,36,31,.36) 0%, rgba(158,36,31,.20) 38%, transparent 72%);

  filter:
    blur(1.2px)
    saturate(1.05);

  border-radius: 54% 46% 48% 52%;
}
    
/* =========================================================
   INNER PAPER PANEL
   This creates the cream inset surface inside the frame.
========================================================= */

.door::before {
  content: "";
  position: absolute;
  inset: 24px;
  z-index: 0;
  pointer-events: none;

  clip-path: polygon(
    16px 0,
    calc(100% - 16px) 0,
    100% 16px,
    100% calc(100% - 16px),
    calc(100% - 16px) 100%,
    16px 100%,
    0 calc(100% - 16px),
    0 16px
  );

  background:
    radial-gradient(circle at center, rgba(255,255,255,.68), transparent 58%),
    radial-gradient(circle at center, transparent 58%, rgba(23,18,14,.07) 100%),
    linear-gradient(
      to bottom,
      rgba(250,244,229,.98),
      rgba(235,225,205,.98)
    );

  box-shadow:
    inset 0 0 0 1.5px rgba(38,31,24,.45),
    inset 0 0 0 4px rgba(255,250,236,.42),
    inset 0 0 26px rgba(23,18,14,.08);
}
    
   .door img,
.door h2,
.door p,
.door div {
  position: relative;
  z-index: 1;
}
    /* =========================================================
   ARTWORK SHADOW
   This gives the object weight inside the frame.
========================================================= */
.door-art {
  position: absolute;
  z-index: 2;
  pointer-events: none;

  filter:
    drop-shadow(0 16px 16px rgba(23,18,14,.32))
    drop-shadow(0 4px 3px rgba(23,18,14,.25));

  transition:
    transform .35s ease,
    filter .35s ease;
}

.door.book:hover .book-art {
  transform:
    translateX(-50%)
    scale(1.05);
}


/* TATTOO MACHINE POSITION */
.tattoo-art {
  width: 58%;
  top: 14%;
  left: 43%;
  transform:
    translateX(-50%)
    rotate(34deg);
}

/* =========================================================
   DOOR SIZES
   Outer doors are taller.
   Middle book door is shorter like your reference.
========================================================= */

.tattoo-wrap {
  grid-area: tattoo;
  height: min(48vh, 440px);
}

.book-wrap {
  grid-area: book;
  height: min(36vh, 340px);
}

.studio-wrap {
  grid-area: studio;
  height: min(48vh, 440px);
}

.door.tattoo {
  --accent: var(--red);
}

.door.book {
  --accent: var(--green);
}

.door.studio {
  --accent: var(--purple);
}

/* TATTOO DOOR HOVER — PRESERVES FLOATING SHADOW */
 /*.door.tattoo:hover {
  box-shadow:
    0 58px 80px rgba(23,18,14,.26),
    0 24px 34px rgba(23,18,14,.18),
    0 10px 16px rgba(23,18,14,.12),

    inset 0 0 45px rgba(23,18,14,.07),

    inset 0 0 0 2px rgba(110,28,20,.85),
    inset 0 0 0 8px rgba(255,248,236,.82),
    inset 0 0 0 10px rgba(150,35,24,.42);

  transform: translateY(-8px);
}*/
/* =========================================================
   TEMP HOVER — PHYSICAL LIFT ONLY
   No neon yet. This tests whether the plaque feels real.
========================================================= */

/* TEMP HOVER — PHYSICAL LIFT ONLY */
.door.tattoo:hover {
  transform: translateY(-8px);
}
/* TATTOO MACHINE LIFTS SLIGHTLY ON HOVER */
.door.tattoo:hover .tattoo-art {
  filter:
    drop-shadow(0 20px 24px rgba(23,18,14,.36));

  transform:
    translateX(-50%)
    rotate(42deg)
    scale(1.05);
}

.icon {
  width: clamp(72px, 6vw, 118px);
  height: clamp(72px, 6vw, 118px);
  margin-bottom: 1.2vh;
}
.door.book .icon {
  width: 126px;
  height: 126px;
}
    .door:hover .icon {
      transform: scale(1.06) rotate(-2deg);
      filter: drop-shadow(0 0 8px var(--accent));
    }

 .door h2 {
  font-size: clamp(1.3rem, 2vw, 2.2rem);
}

 .copy {
  margin-top: 1.2vh;
  font-size: clamp(.78rem, .9vw, .98rem);
  line-height: 1.55;
}

.enter {
  min-width: unset;
  width: 82%;
  padding: 10px 12px;
  font-size: .78rem;
}

.door:hover .enter {
  letter-spacing: .34em;
  transform: translateY(-2px);
}
/* BOOK IMAGE POSITION */
.book-art {
  width: 54%;
  top: 21%;
  left: 50%;
  transform:
    translateX(-50%);
}

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

@media (max-width: 900px) {
  .entry {
    height: auto;
    min-height: 100vh;
    overflow: visible;
    padding: 28px 18px 42px;
  }

  .logo-stack {
    width: min(340px, 82vw);
    margin-bottom: 12px;
  }

  .doors {
    grid-template-columns: 1fr;
    max-height: none;
    gap: 18px;
    margin-top: 24px;
  }

  .door,
  .door.book {
    height: auto;
    transform: none;
  }
}
  </style>
</head>
<body>
  <main class="entry">
   <div class="logo-stack">
  <img src="Images/logo-base.png" class="logo-base" alt="PaperCrane Books & Tattoo logo">
  <img src="Images/logo-crane.png" class="logo-crane" alt="">
</div>

 <div class="hero-spacer" aria-hidden="true"></div>

<section class="doors" aria-label="Choose where to enter">

  <div class="door-wrap tattoo-wrap">
<a class="door tattoo" href="tattoo.html">
  <span class="door-wash" aria-hidden="true"></span>

  <img src="Images/gun.png"
       class="door-art tattoo-art"
       alt="Coil tattoo machine">
</a>
  </div>

  <div class="door-wrap book-wrap">
 <a class="door book" href="bookstore.html">
  <span class="door-wash" aria-hidden="true"></span>

  <img src="Images/book.png"
       class="door-art book-art"
       alt="Open book illustration">
</a>
  </div>

  <div class="door-wrap studio-wrap">
   <a class="door studio" href="studio.html">
  <span class="door-wash" aria-hidden="true"></span>
</a>
  </div>

</section>
