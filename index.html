<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperCrane Books & Tattoo</title>
  <style>
    :root {
      --paper: #efe2c6;
      --paper-deep: #d8c39d;
      --ink: #17120e;
      --muted: #6f5d48;
      --gold: #b7863c;
      --red: #9e241f;
      --green: #55612f;
      --purple: #6d3f78;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at center top, rgba(255,255,255,.55), transparent 36%),
        radial-gradient(circle at 15% 20%, rgba(183,134,60,.18), transparent 22%),
        linear-gradient(135deg, #f5ead5, var(--paper) 48%, #dbc6a4);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(23,18,14,.12) 1px, transparent 1px),
        radial-gradient(rgba(23,18,14,.08) 1px, transparent 1px);
      background-size: 27px 27px, 11px 11px;
      opacity: .22;
      mix-blend-mode: multiply;
    }

    .entry {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 22px;
      position: relative;
    }

    .crane {
    width: 86px;
    height: 66px;
    margin-bottom: 18px;
    animation: craneLand 1.9s cubic-bezier(.2,.9,.2,1) both;
    transform-origin: center;
    }

    .logo-stack {
    position: relative;
    width: min(360px, 82vw);
    margin: 0 auto 20px;
    }  

    .logo-base {
    width: 100%;
    display: block;
    position: relative;
    z-index: 1;
  }

.logo-crane {
  position: absolute;
  width: 72%;
  top: 5%;
  left: 20%;
  z-index: 2;
  transform-origin: 50% 55%;
  animation: craneSpinLand 4.5s cubic-bezier(.18,.85,.22,1) forwards;
}

@keyframes craneSpinLand {
  0% {
    opacity: 0;
    transform: rotate(0deg) scale(2.2);
  }

  8% {
    opacity: 1;
  }

  25% {
    transform: rotate(360deg) scale(1.85);
  }

  45% {
    transform: rotate(720deg) scale(1.55);
  }

  65% {
    transform: rotate(1080deg) scale(1.3);
  }

  85% {
    transform: rotate(1440deg) scale(1.12);
  }

  100% {
    opacity: 1;
    transform: rotate(1800deg) scale(1);
  }
}

  100% {
    opacity: 1;
    transform: translateY(0) rotate(1800deg) scale(1);
  }
}

    .brand {
      text-align: center;
      animation: fadeUp .9s ease both;
      animation-delay: 1.15s;
    }

    .brand h1 {
      font-size: clamp(3.1rem, 9vw, 7.5rem);
      letter-spacing: .16em;
      font-weight: 400;
      line-height: .9;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    .brand .sub {
      margin-top: 18px;
      color: #7f1d1a;
      font-family: Arial, sans-serif;
      letter-spacing: .48em;
      text-transform: uppercase;
      font-size: clamp(.8rem, 1.5vw, 1.08rem);
    }

    .rule {
      width: min(560px, 78vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 22px auto 18px;
      position: relative;
    }

    .tagline {
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: .42em;
      font-size: clamp(.72rem, 1.3vw, .95rem);
      color: #2a211a;
      animation: fadeUp .9s ease both;
      animation-delay: 1.45s;
    }

    .doors {
      width: min(1120px, 100%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      margin-top: 58px;
      animation: fadeUp .9s ease both;
      animation-delay: 1.8s;
    }

    .door {
      min-height: 310px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 34px 26px 28px;
      color: var(--ink);
      text-decoration: none;
      background: rgba(255,248,232,.48);
      border: 2px solid rgba(23,18,14,.68);
      box-shadow: 0 18px 50px rgba(42, 28, 16, .12);
      transition: transform .35s ease, box-shadow .35s ease, background .35s ease, border-color .35s ease;
      overflow: hidden;
    }

    .door::before {
      content: "";
      position: absolute;
      inset: -2px;
      opacity: 0;
      transition: opacity .35s ease;
      pointer-events: none;
    }

    .door::after {
      content: "";
      position: absolute;
      width: 160px;
      height: 86px;
      top: 40px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      opacity: .92;
      z-index: 0;
      border-radius: 45% 42% 48% 38%;
      filter: saturate(.9);
    }

    .door > * {
      position: relative;
      z-index: 1;
    }

    .door:hover {
      transform: translateY(-8px);
      background: rgba(255,248,232,.62);
    }

    .door.tattoo {
      --accent: var(--red);
    }

    .door.book {
      --accent: var(--green);
    }

    .door.studio {
      --accent: var(--purple);
    }

    .door.tattoo::after { background: var(--red); }
    .door.book::after { background: var(--green); }
    .door.studio::after { background: var(--purple); }

    .door.tattoo:hover {
      border-color: var(--red);
      box-shadow: 0 0 22px rgba(158,36,31,.55), 0 22px 60px rgba(42, 28, 16, .18);
    }

    .door.tattoo:hover::before {
      opacity: 1;
      background: radial-gradient(circle at center 28%, rgba(158,36,31,.22), transparent 46%);
      animation: neonFlicker 1.2s infinite alternate;
    }

    .door.book:hover {
      border-color: var(--green);
      box-shadow: 0 0 20px rgba(85,97,47,.44), 0 22px 60px rgba(42, 28, 16, .18);
    }

    .door.book:hover::before {
      opacity: 1;
      background: radial-gradient(circle at center 28%, rgba(183,134,60,.25), transparent 48%);
    }

    .door.studio:hover {
      border-color: var(--purple);
      box-shadow: 0 0 20px rgba(109,63,120,.48), 0 22px 60px rgba(42, 28, 16, .18);
    }

    .door.studio:hover::before {
      opacity: 1;
      background: radial-gradient(circle at center 28%, rgba(109,63,120,.22), transparent 48%);
    }

    @keyframes neonFlicker {
      0%, 100% { opacity: .72; }
      45% { opacity: .95; }
      52% { opacity: .58; }
      58% { opacity: 1; }
    }

    .icon {
      width: 84px;
      height: 84px;
      margin-bottom: 28px;
      color: #fff3dc;
      filter: drop-shadow(0 2px 0 rgba(0,0,0,.35));
      transition: transform .35s ease, filter .35s ease;
    }

    .door:hover .icon {
      transform: scale(1.06) rotate(-2deg);
      filter: drop-shadow(0 0 8px var(--accent));
    }

    .door h2 {
      font-size: clamp(1.55rem, 2.8vw, 2.25rem);
      line-height: 1.05;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
    }

    .copy {
      margin-top: 22px;
      font-family: Arial, sans-serif;
      font-size: .98rem;
      line-height: 1.75;
      letter-spacing: .05em;
    }

    .enter {
      margin-top: 24px;
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: .34em;
      color: var(--accent);
      font-weight: 700;
      transition: letter-spacing .28s ease;
    }

    .door:hover .enter {
      letter-spacing: .42em;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      .entry {
        justify-content: flex-start;
      }

      .doors {
        grid-template-columns: 1fr;
        max-width: 430px;
        margin-top: 38px;
      }

      .door {
        min-height: 260px;
      }

      .brand h1 {
        letter-spacing: .1em;
      }
    }
  </style>
</head>
<body>
  <main class="entry">
   <div class="logo-stack">
  <img src="Images/logo-base.png" class="logo-base" alt="PaperCrane Books & Tattoo logo">
  <img src="Images/logo-crane.png" class="logo-crane" alt="">
</div>

    <p class="tagline">One Space. Many Stories.</p>

    <section class="doors" aria-label="Choose where to enter">
      <a class="door tattoo" href="tattoo.html">
        <div>
          <svg class="icon" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M32 18h33l8 13-6 35H30l-7-35z" fill="none" stroke="currentColor" stroke-width="5" />
            <path d="M37 28h9v29h-9zM53 28h9v29h-9z" fill="none" stroke="currentColor" stroke-width="4" />
            <path d="M24 31 11 44M72 31l15-14M30 66 15 89M66 66l20 17" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
            <path d="M13 44l10 9M85 18l6 11" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
          </svg>
          <h2>Tattoo &amp;<br>Walk-In Shop</h2>
          <p class="copy">Quality work.<br>Great people.<br>Walk-ins welcome.</p>
        </div>
        <span class="enter">Enter →</span>
      </a>

      <a class="door book" href="bookstore.html">
        <div>
          <svg class="icon" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M14 25c16-6 28-4 36 5v48c-8-9-20-11-36-5z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
            <path d="M86 25c-16-6-28-4-36 5v48c8-9 20-11 36-5z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
            <path d="M24 39h17M24 51h17M59 39h17M59 51h17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </svg>
          <h2>Book Store</h2>
          <p class="copy">Books &amp; oddities.<br>Stay awhile.</p>
        </div>
        <span class="enter">Enter →</span>
      </a>

      <a class="door studio" href="studio.html">
        <div>
          <svg class="icon" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="68" cy="25" r="14" fill="none" stroke="currentColor" stroke-width="5" />
            <circle cx="82" cy="39" r="12" fill="none" stroke="currentColor" stroke-width="5" />
            <circle cx="58" cy="42" r="10" fill="none" stroke="currentColor" stroke-width="5" />
            <path d="M58 49 22 85M30 77l10 10M39 68l9 9" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
          </svg>
          <h2>Private Studio</h2>
          <p class="copy">Custom work by appointment.<br>Private space.</p>
        </div>
        <span class="enter">Enter →</span>
      </a>
    </section>
  </main>
</body>
</html>
