<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperCrane Books & Tattoo</title>
  <style>
    :root {
      --paper: #efe2c6;
      --paper-deep: #d8c39d;
      --ink: #17120e;
      --muted: #6f5d48;
      --gold: #b7863c;
      --red: #9e241f;
      --green: #55612f;
      --purple: #6d3f78;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

body {
  height: 100svh;
  font-family: Georgia, "Times New Roman", serif;
  color: #efe3c7;

  background: #050505;

  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(rgba(255,238,198,.08) 1px, transparent 1px);
  background-size: 18px 18px;
  opacity: .16;
  mix-blend-mode: screen;
}

.entry {
  height: 100svh;
  width: min(1180px, 92vw);
  margin: 0 auto;

  display: grid;
  grid-template-rows: 44px 255px 1fr;
  justify-items: center;
  align-items: start;

  padding: 14px 0 18px;
  overflow: hidden;
}
/* TOP NAV */

.top-nav {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, auto) 1fr repeat(3, auto);
  align-items: center;
  column-gap: clamp(28px, 5vw, 80px);

  margin-bottom: 0;

  font-family: Georgia, "Times New Roman", serif;
  text-transform: uppercase;
  letter-spacing: .18em;
  font-size: clamp(.68rem, .9vw, .9rem);

  position: relative;
  z-index: 20;
}

.top-nav a {
  color: rgba(255, 232, 170, .88);
  text-decoration: none;

  text-shadow:
    0 0 1px rgba(255, 246, 218, .85);

  filter:
    drop-shadow(0 0 2px rgba(255, 220, 120, .45))
    drop-shadow(0 0 8px rgba(255, 190, 38, .22));

  transition:
    color .25s ease,
    filter .25s ease,
    text-shadow .25s ease;
}

.top-nav a:hover {
  color: rgba(255, 236, 170, 1);

  text-shadow:
    0 0 2px rgba(255, 236, 170, 1),
    0 0 6px rgba(255, 154, 32, .82);

  filter:
    drop-shadow(0 0 3px rgba(255, 236, 170, 1))
    drop-shadow(0 0 10px rgba(255, 154, 32, .92))
    drop-shadow(0 0 22px rgba(230, 95, 12, .62))
    drop-shadow(0 0 40px rgba(160, 55, 0, .38));
}

.top-nav a.active {
  color: rgba(255, 232, 170, .95);

  text-shadow:
    0 0 1px rgba(255, 246, 218, .85);

  filter:
    drop-shadow(0 0 2px rgba(255, 220, 120, .50))
    drop-shadow(0 0 10px rgba(255, 190, 38, .26));
}

.top-nav a.active:hover {
  color: rgba(255, 236, 170, 1);

  text-shadow:
    0 0 2px rgba(255, 236, 170, 1),
    0 0 6px rgba(255, 154, 32, .82);

  filter:
    drop-shadow(0 0 3px rgba(255, 236, 170, 1))
    drop-shadow(0 0 10px rgba(255, 154, 32, .92))
    drop-shadow(0 0 22px rgba(230, 95, 12, .62))
    drop-shadow(0 0 40px rgba(160, 55, 0, .38));
}

.top-nav a::after {
  content: "";
  display: block;
  width: 32px;
  height: 1px;
  margin: 9px auto 0;
  background: transparent;
}

.top-nav a.active::after {
  background: linear-gradient(90deg, transparent, #b7863c, transparent);
}


/* TOP HERO: LEFT TEXT / LOGO / RIGHT TEXT */

.hero-top {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr minmax(280px, 390px) 1fr;
  align-items: center;
  column-gap: clamp(28px, 5vw, 72px);

  margin-bottom: 0;
}

.logo-stack {
  position: relative;
  width: min(460px, 38vw);
  margin: 0 auto;
  transform: translateY(-10px);
  z-index: 5;
  overflow: visible;

  animation: logoShapeGlow 3.5s ease-out 1.8s forwards;
}

/* make sure the real logo artwork stays above the glow */
.logo-stack > * {
  position: relative;
  z-index: 2;
}

.logo-base {
  width: 100%;
  display: block;
  position: relative;
  z-index: 1;
}

.logo-crane {
  position: absolute;
  width: 75%;
  top: -10%;
  left: 10%;
  z-index: 2;
  transform-origin: 50% 55%;
  animation: craneSpinLand 1.8s linear forwards;
}


/* =========================
   SIDE COPY BLOCK
   ========================= */
.side-copy {
  width: 100%;
  text-align: center;

  font-family: Georgia, "Times New Roman", serif;
  text-transform: uppercase;
  letter-spacing: .22em;
  color: rgba(239, 227, 199, .82);

  font-size: clamp(.95rem, 1.4vw, 1.35rem);
  line-height: 1.65;
}

.side-copy p {
  margin: 0;
}

/* add spacing around the text rows */
.side-copy p + .accent-short {
  margin-top: 12px;
}

.accent-middle {
  margin-bottom: 12px;
}

.accent-bottom {
  margin-top: 14px;
}


/* =========================
   TOP LONG ACCENT LINE
   ========================= */
.accent-top {
  position: relative;
  width: min(430px, 100%);
  height: 1px;
  margin: 0 auto 26px;

  background: linear-gradient(
    90deg,
    rgba(183,134,60,.72),
    rgba(183,134,60,.42),
    rgba(183,134,60,.18)
  );
}

/* mirror the top line direction on the right side */
.right-copy .accent-top {
  background: linear-gradient(
    90deg,
    rgba(183,134,60,.18),
    rgba(183,134,60,.42),
    rgba(183,134,60,.72)
  );
}

/* center diamond on top line */
.accent-top::after {
  content: "✦";
  position: absolute;
  top: 50%;
  left: 56%;
  transform: translate(-50%, -52%);
  font-size: .65rem;
  color: rgba(183,134,60,.88);

  animation: accentDiamondGlow 3.5s ease-out 1.8s forwards;
}


/* outer-edge larger burst on left block */
.left-copy .accent-top::before {
  content: "✦";
  position: absolute;
  top: 50%;
  left: -10px;
  transform: translateY(-52%);
  font-size: 1rem;
  color: rgba(183,134,60,.92);

  animation: accentDiamondGlow 3.5s ease-out 1.8s forwards;
}

/* =========================
   SHORT ACCENT LINES
   one between text rows
   one at the bottom
   ========================= */
.accent-short {
  position: relative;
  width: min(220px, 72%);
  height: 1px;
  margin-left: auto;
  margin-right: auto;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(183,134,60,.62),
    transparent
  );
}
    .accent-short::after {
  content: "✦";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -52%);
  font-size: .6rem;
  color: rgba(183,134,60,.85);

  animation: accentDiamondGlow 3.5s ease-out 1.8s forwards;
}

/* outer-edge larger burst on right block */
.right-copy .accent-top::before {
  content: "✦";
  position: absolute;
  top: 50%;
  right: -10px;
  transform: translateY(-52%);
  font-size: 1rem;
  color: rgba(183,134,60,.92);

  animation: accentDiamondGlow 3.5s ease-out 1.8s forwards;
}

@keyframes craneSpinLand {
  0% {
    opacity: 0;
    transform:
      translateY(34vh)
      rotate(0deg)
      scale(4.2);
  }

  14% {
    opacity: .35;
  }

  28% {
    opacity: .75;
  }

  42% {
    opacity: 1;
  }

  100% {
    opacity: 1;
    transform:
      translateY(0)
      rotate(1080deg)
      scale(1);
  }
}
@keyframes accentDiamondGlow {
  0% {
    color: rgba(183,134,60,.82);
    text-shadow: none;
    filter: none;
  }

  15% {
    color: rgba(255, 250, 224, 1);
    text-shadow:
      0 0 3px rgba(255, 255, 245, .95),
      0 0 8px rgba(255, 236, 150, .88),
      0 0 18px rgba(255, 154, 32, .62),
      0 0 32px rgba(230, 95, 12, .38);

    filter:
      drop-shadow(0 0 4px rgba(255, 236, 170, .95))
      drop-shadow(0 0 14px rgba(255, 154, 32, .55));
  }

  65% {
    color: rgba(255, 238, 184, .95);
    text-shadow:
      0 0 3px rgba(255, 255, 245, .75),
      0 0 8px rgba(255, 236, 150, .62),
      0 0 16px rgba(255, 154, 32, .42);

    filter:
      drop-shadow(0 0 4px rgba(255, 236, 170, .68))
      drop-shadow(0 0 12px rgba(255, 154, 32, .35));
  }

  100% {
    color: rgba(183,134,60,.82);
    text-shadow: none;
    filter: none;
  }
}
    @keyframes logoShapeGlow {
  0% {
    filter: none;
  }

  15% {
    filter:
      drop-shadow(0 0 4px rgba(255, 250, 224, .95))
      drop-shadow(0 0 14px rgba(255, 236, 170, .75))
      drop-shadow(0 0 34px rgba(255, 154, 32, .48))
      drop-shadow(0 0 58px rgba(230, 95, 12, .28));
  }

  65% {
    filter:
      drop-shadow(0 0 4px rgba(255, 250, 224, .90))
      drop-shadow(0 0 12px rgba(255, 236, 170, .68))
      drop-shadow(0 0 28px rgba(255, 154, 32, .40))
      drop-shadow(0 0 48px rgba(230, 95, 12, .22));
  }

  100% {
    filter: none;
  }
}
    
    .brand {
      text-align: center;
      animation: fadeUp .9s ease both;
      animation-delay: 1.15s;
    }

    .brand h1 {
      font-size: clamp(3.1rem, 9vw, 7.5rem);
      letter-spacing: .16em;
      font-weight: 400;
      line-height: .9;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    .brand .sub {
      margin-top: 18px;
      color: #7f1d1a;
      font-family: Arial, sans-serif;
      letter-spacing: .48em;
      text-transform: uppercase;
      font-size: clamp(.8rem, 1.5vw, 1.08rem);
    }

    .rule {
      width: min(560px, 78vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 22px auto 18px;
      position: relative;
    }

.tagline {
  font-family: Arial, sans-serif;
  text-transform: uppercase;
  letter-spacing: .42em;
  font-size: clamp(.62rem, 1vw, .9rem);
  color: #2a211a;
  margin: 0;
  animation: fadeUp .9s ease both;
  animation-delay: 4.7s;
}
/* =========================================================
   DOOR LAYOUT — IMAGE-BASED VERSION
   The frame is now an image asset: Images/door.png
========================================================= */

.doors {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(260px, 360px));
  grid-template-areas: "tattoo book studio";
  justify-content: center;
  align-items: end;
  justify-items: center;

  gap: clamp(32px, 4.5vw, 72px);

  margin-top: 20px;

  overflow: visible;

  animation: fadeUp .9s ease both;
  animation-delay: 2.0s;
}
.door-wrap {
  position: relative;
  width: 100%;
  max-width: 380px;
  aspect-ratio: 4 / 5.05;
  overflow: visible;
}

.door-wrap {
  position: relative;
  width: 100%;
  max-width: 380px;
  aspect-ratio: 4 / 5.05;
  overflow: visible;
}

.tattoo-wrap {
  grid-area: tattoo;
}

.book-wrap {
  grid-area: book;
}

.studio-wrap {
  grid-area: studio;
}

.door {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  text-decoration: none;
  transform: translateY(0);
  transition:
    transform .35s ease,
    filter .35s ease;
}

.door-frame {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  pointer-events: none;
  filter:
    drop-shadow(0 14px 18px rgba(0,0,0,.45))
    drop-shadow(0 0 10px rgba(183,134,60,.12));
  transition: filter .35s ease;
}

.door:hover {
  transform: translateY(-8px);
}

.door:hover .door-frame {
  filter:
    drop-shadow(0 18px 26px rgba(0,0,0,.58))
    drop-shadow(0 0 4px var(--glow-core))
    drop-shadow(0 0 12px var(--glow))
    drop-shadow(0 0 28px var(--glow-soft))
    drop-shadow(0 0 52px var(--glow-faint));
}

/* Shared interior artwork */
.door-art {
  position: absolute;
  z-index: 2;
  pointer-events: none;
  transition:
    transform .35s ease,
    filter .35s ease;

  /* same dark shadow for tattoo + book */
  filter:
    drop-shadow(0 16px 16px rgba(0,0,0,.48))
    drop-shadow(0 5px 5px rgba(0,0,0,.38));
}

/* Tattoo machine */
.tattoo-art {
  width: 50%;
  top: 18%;
  left: 50%;
  transform: translateX(-50%) rotate(32deg);
}

.door.tattoo:hover .tattoo-art {
  transform: translateX(-50%) rotate(40deg) scale(1.05);
  filter:
    drop-shadow(0 24px 22px rgba(0,0,0,.62))
    drop-shadow(0 8px 7px rgba(0,0,0,.48));
}

/* Book */
.book-art {
  width: 58%;
  top: 24%;
  left: 50%;
  transform: translateX(-50%);
}

.door.book:hover .book-art {
  transform: translateX(-50%) scale(1.05);
  filter:
    drop-shadow(0 24px 22px rgba(0,0,0,.62))
    drop-shadow(0 8px 7px rgba(0,0,0,.48));
}

/* Keyhole for private studio */
.keyhole-art {
  position: absolute;
  z-index: 2;
  width: 48%;
  top: 22%;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  filter:
  drop-shadow(0 16px 16px rgba(0,0,0,.48))
  drop-shadow(0 5px 5px rgba(0,0,0,.38));
  transition:
    transform .35s ease,
    filter .35s ease;
}

.door.studio:hover .keyhole-art {
  transform: translateX(-50%) scale(1.06);
  filter:
    drop-shadow(0 24px 22px rgba(0,0,0,.62))
    drop-shadow(0 8px 7px rgba(0,0,0,.48));
}

/* Door-specific neon glow colors */

.door.tattoo,
.door.book,
.door.studio {
  --glow-core: rgba(255, 236, 170, 1);
  --glow: rgba(255, 154, 32, .92);
  --glow-soft: rgba(230, 95, 12, .62);
  --glow-faint: rgba(160, 55, 0, .38);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 900px) {
  .entry {
    width: min(420px, 88vw);
    min-height: 100vh;
    padding: 28px 0 42px;
  }

  .top-nav {
    display: none;
  }

.hero-top {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr minmax(320px, 460px) 1fr;
  align-items: center;
  column-gap: clamp(24px, 4vw, 64px);

  margin-bottom: 0;
}

  .logo-stack {
    width: min(330px, 82vw);
    grid-row: 1;
  }

  .side-copy {
    display: none;
  }

  .doors {
    width: 100%;
    grid-template-columns: 1fr;
    grid-template-areas:
      "tattoo"
      "book"
      "studio";
    gap: 24px;
  }

  .door-wrap {
    max-width: 300px;
  }

  .door {
    transform: none;
  }

  .bottom-links {
    width: min(320px, 80vw);
  }
}
  </style>
</head>
<body>
  <main class="entry">

  <nav class="top-nav" aria-label="Main navigation">
    <a href="index.html" class="active">Home</a>
    <a href="about.html">About</a>
    <a href="artists.html">Artists</a>
    <span></span>
    <a href="events.html">Events</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section class="hero-top" aria-label="PaperCrane Books and Tattoo introduction">

<div class="side-copy left-copy">
  <div class="accent-top"></div>

  <p>ONE SPACE.</p>

  <div class="accent-short accent-middle"></div>

  <p>MANY STORIES.</p>

  <div class="accent-short accent-bottom"></div>
</div>

 <div class="logo-stack">
<img src="Images/logo-base.png" class="logo-base" alt="PaperCrane Books & Tattoo logo">
<img src="Images/logo-crane.png" class="logo-crane" alt="">
</div>

  <div class="side-copy right-copy">
  <div class="accent-top"></div>

  <p>BOOKS. INK.</p>

  <div class="accent-short accent-middle"></div>

  <p>CONNECTION.</p>

  <div class="accent-short accent-bottom"></div>
</div>

  </section>

  <section class="doors" aria-label="Choose where to enter">

    <div class="door-wrap tattoo-wrap">
      <a class="door tattoo" href="tattoo.html">
        <img src="Images/door.png"

             aria-hidden="true">

        <img src="Images/keyhole.png"
             class="keyhole-art"
             alt="Private studio keyhole">
      </a>
    </div>

  </section>



</main>
</body>
</html>
