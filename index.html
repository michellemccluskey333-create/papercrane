<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperCrane Books & Tattoo</title>
  <style>
    :root {
      --paper: #efe2c6;
      --paper-deep: #d8c39d;
      --ink: #17120e;
      --muted: #6f5d48;
      --gold: #b7863c;
      --red: #9e241f;
      --green: #55612f;
      --purple: #6d3f78;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

body {
  height: 100svh;
  font-family: Georgia, "Times New Roman", serif;
  color: #efe3c7;

  background: #050505;

  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(rgba(255,238,198,.08) 1px, transparent 1px);
  background-size: 18px 18px;
  opacity: .16;
  mix-blend-mode: screen;
}

.entry {
  height: 100svh;
  width: min(1180px, 92vw);
  margin: 0 auto;

  display: grid;
  grid-template-rows: 44px 255px 1fr;
  justify-items: center;
  align-items: start;

  padding: 14px 0 18px;
  overflow: hidden;
}
/* TOP NAV */

.top-nav {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, auto) 1fr repeat(3, auto);
  align-items: center;
  column-gap: clamp(28px, 5vw, 80px);

  margin-bottom: 0;

  font-family: Georgia, "Times New Roman", serif;
  text-transform: uppercase;
  letter-spacing: .18em;
  font-size: clamp(.68rem, .9vw, .9rem);
}

.top-nav a {
  color: rgba(239, 227, 199, .78);
  text-decoration: none;
}

.top-nav a.active {
  color: #9e241f;
}

.top-nav a::after {
  content: "";
  display: block;
  width: 32px;
  height: 1px;
  margin: 9px auto 0;
  background: transparent;
}

.top-nav a.active::after {
  background: linear-gradient(90deg, transparent, #b7863c, transparent);
}

/* TOP HERO: LEFT TEXT / LOGO / RIGHT TEXT */

.hero-top {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr minmax(280px, 390px) 1fr;
  align-items: center;
  column-gap: clamp(28px, 5vw, 72px);

  margin-bottom: 0;
}

.logo-stack {
  position: relative;
  width: min(390px, 34vw);
  margin: 0 auto;
  top: -90px;
  z-index: 5;
}

    .crane {
    width: 86px;
    height: 66px;
    margin-bottom: 18px;
    animation: craneLand 1.9s cubic-bezier(.2,.9,.2,1) both;
    transform-origin: center;
    }

.logo-stack {
  position: relative;
  width: min(390px, 34vw);
  margin: 0 auto;
  z-index: 5;
}

.logo-base {
  width: 100%;
  display: block;
  position: relative;
  z-index: 1;
}

.logo-crane {
  position: absolute;
  width: 58%;
  top: 2%;
  left: 26%;
  z-index: 2;
  transform-origin: 50% 55%;
  animation: craneSpinLand 4.5s cubic-bezier(.18,.85,.22,1) forwards;
}
/* SIDE COPY */

.side-copy {
  width: 100%;
  text-align: center;

  font-family: Georgia, "Times New Roman", serif;
  text-transform: uppercase;
  letter-spacing: .28em;
  color: rgba(239, 227, 199, .78);

  font-size: clamp(.9rem, 1.5vw, 1.25rem);
  line-height: 1.8;
}

.side-copy p {
  margin: 0;
}

.accent-line {
  width: min(300px, 100%);
  height: 1px;
  margin: 0 auto 22px;
  background:
    linear-gradient(90deg, transparent, rgba(183,134,60,.75), transparent);
  position: relative;
}

.accent-line::after {
  content: "✦";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -52%);
  color: rgba(183,134,60,.75);
  font-size: .7rem;
}

.accent-line.short {
  width: min(210px, 82%);
  margin: 18px auto 0;
}

.bottom-links {
  width: min(520px, 70vw);
  display: grid;
  grid-template-columns: 1fr auto auto auto auto auto 1fr;
  align-items: center;
  gap: 16px;

  margin-top: -4px;

  color: rgba(239, 227, 199, .58);
  font-size: .95rem;
}

.bottom-links a {
  color: rgba(239, 227, 199, .58);
  text-decoration: none;
}

.bottom-line {
  height: 1px;
  background:
    linear-gradient(90deg, transparent, rgba(183,134,60,.65), transparent);
}

@keyframes craneSpinLand {
  0% {
    opacity: 0;
    transform:
      translate(0vw, 0vh)
      rotate(0deg)
      scale(5);
  }

  8% {
    opacity: .45;
  }

  18% {
    opacity: .85;
  }

  28% {
    opacity: 1;
  }

  100% {
    opacity: 1;
    transform:
      translate(0, 0)
      rotate(1800deg)
      scale(1);
  }
}
    .brand {
      text-align: center;
      animation: fadeUp .9s ease both;
      animation-delay: 1.15s;
    }

    .brand h1 {
      font-size: clamp(3.1rem, 9vw, 7.5rem);
      letter-spacing: .16em;
      font-weight: 400;
      line-height: .9;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    .brand .sub {
      margin-top: 18px;
      color: #7f1d1a;
      font-family: Arial, sans-serif;
      letter-spacing: .48em;
      text-transform: uppercase;
      font-size: clamp(.8rem, 1.5vw, 1.08rem);
    }

    .rule {
      width: min(560px, 78vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 22px auto 18px;
      position: relative;
    }

.tagline {
  font-family: Arial, sans-serif;
  text-transform: uppercase;
  letter-spacing: .42em;
  font-size: clamp(.62rem, 1vw, .9rem);
  color: #2a211a;
  margin: 0;
  animation: fadeUp .9s ease both;
  animation-delay: 4.7s;
}
/* =========================================================
   DOOR LAYOUT — IMAGE-BASED VERSION
   The frame is now an image asset: Images/door.png
========================================================= */

.doors {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(260px, 360px));
  grid-template-areas: "tattoo book studio";
  justify-content: center;
  align-items: end;
  justify-items: center;

  gap: clamp(32px, 4.5vw, 72px);

  margin-top: 20px;

  overflow: visible;

  animation: fadeUp .9s ease both;
  animation-delay: 3.7s;
}
.door-wrap {
  position: relative;
  width: 100%;
  max-width: 360px;
  aspect-ratio: 4 / 5.05;
  overflow: visible;
}

.door-wrap {
  position: relative;
  width: 100%;
  max-width: 340px;
  aspect-ratio: 4 / 5.05;
  overflow: visible;
}

.tattoo-wrap {
  grid-area: tattoo;
}

.book-wrap {
  grid-area: book;
}

.studio-wrap {
  grid-area: studio;
}

.door {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  text-decoration: none;
  transform: translateY(0);
  transition:
    transform .35s ease,
    filter .35s ease;
}

.door-frame {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  pointer-events: none;
  filter:
    drop-shadow(0 14px 18px rgba(0,0,0,.45))
    drop-shadow(0 0 10px rgba(183,134,60,.12));
  transition: filter .35s ease;
}

.door:hover {
  transform: translateY(-8px);
}

.door:hover .door-frame {
  filter:
    drop-shadow(0 18px 26px rgba(0,0,0,.55))
    drop-shadow(0 0 18px var(--glow));
}

/* Shared interior artwork */
.door-art {
  position: absolute;
  z-index: 2;
  pointer-events: none;
  transition:
    transform .35s ease,
    filter .35s ease;
  filter:
    drop-shadow(0 12px 12px rgba(23,18,14,.32));
}

/* Tattoo machine */
.tattoo-art {
  width: 50%;
  top: 22%;
  left: 50%;
  transform: translateX(-50%) rotate(32deg);
}

.door.tattoo:hover .tattoo-art {
  transform: translateX(-50%) rotate(40deg) scale(1.05);
  filter:
    drop-shadow(0 16px 18px rgba(23,18,14,.38))
    drop-shadow(0 0 8px rgba(158,36,31,.42));
}

/* Book */
.book-art {
  width: 48%;
  top: 24%;
  left: 50%;
  transform: translateX(-50%);
}

.door.book:hover .book-art {
  transform: translateX(-50%) scale(1.05);
  filter:
    drop-shadow(0 16px 18px rgba(23,18,14,.38))
    drop-shadow(0 0 8px rgba(85,97,47,.38));
}

/* Keyhole for private studio */
.keyhole-art {
  position: absolute;
  z-index: 2;
  width: 34%;
  top: 26%;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  filter:
    drop-shadow(0 10px 12px rgba(0,0,0,.42));
  transition:
    transform .35s ease,
    filter .35s ease;
}

.door.studio:hover .keyhole-art {
  transform: translateX(-50%) scale(1.06);
  filter:
    drop-shadow(0 12px 16px rgba(0,0,0,.50))
    drop-shadow(0 0 12px rgba(109,63,120,.55));
}

/* Door-specific glow colors */
.door.tattoo {
  --glow: rgba(158,36,31,.55);
}

.door.book {
  --glow: rgba(85,97,47,.50);
}

.door.studio {
  --glow: rgba(109,63,120,.55);
}

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

@media (max-width: 900px) {
  .entry {
    width: min(420px, 88vw);
    min-height: 100vh;
    padding: 28px 0 42px;
  }

  .top-nav {
    display: none;
  }

  .hero-top {
    grid-template-columns: 1fr;
    row-gap: 18px;
    margin-bottom: 24px;
  }

  .logo-stack {
    width: min(330px, 82vw);
    grid-row: 1;
  }

  .side-copy {
    display: none;
  }

  .doors {
    width: 100%;
    grid-template-columns: 1fr;
    grid-template-areas:
      "tattoo"
      "book"
      "studio";
    gap: 24px;
  }

  .door-wrap {
    max-width: 300px;
  }

  .door {
    transform: none;
  }

  .bottom-links {
    width: min(320px, 80vw);
  }
}
  </style>
</head>
<body>
  <main class="entry">

  <nav class="top-nav" aria-label="Main navigation">
    <a href="index.html" class="active">Home</a>
    <a href="about.html">About</a>
    <a href="artists.html">Artists</a>
    <span></span>
    <a href="events.html">Events</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section class="hero-top" aria-label="PaperCrane Books and Tattoo introduction">

    <div class="side-copy left-copy">
      <div class="accent-line"></div>
      <p>One space.</p>
      <p>Many stories.</p>
      <div class="accent-line short"></div>
    </div>

    <div class="logo-stack">
      <img src="Images/logo-base.png" class="logo-base" alt="PaperCrane Books & Tattoo logo">
      <img src="Images/logo-crane.png" class="logo-crane" alt="">
    </div>

    <div class="side-copy right-copy">
      <div class="accent-line"></div>
      <p>Books. Ink.</p>
      <p>Connection.</p>
      <div class="accent-line short"></div>
    </div>

  </section>

  <section class="doors" aria-label="Choose where to enter">

    <div class="door-wrap tattoo-wrap">
      <a class="door tattoo" href="tattoo.html">
        <img src="Images/door.png"
             class="door-frame"
             alt=""
             aria-hidden="true">

        <img src="Images/gun.png"
             class="door-art tattoo-art"
             alt="Coil tattoo machine">
      </a>
    </div>

    <div class="door-wrap book-wrap">
      <a class="door book" href="bookstore.html">
        <img src="Images/door.png"
             class="door-frame"
             alt=""
             aria-hidden="true">

        <img src="Images/book.png"
             class="door-art book-art"
             alt="Open book illustration">
      </a>
    </div>

    <div class="door-wrap studio-wrap">
      <a class="door studio" href="studio.html">
        <img src="Images/door.png"
             class="door-frame"
             alt=""
             aria-hidden="true">

        <img src="Images/keyhole.png"
             class="keyhole-art"
             alt="Private studio keyhole">
      </a>
    </div>

  </section>



</main>
</body>
</html>
