<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperCrane Books & Tattoo</title>
  <style>
    :root {
      --paper: #efe2c6;
      --paper-deep: #d8c39d;
      --ink: #17120e;
      --muted: #6f5d48;
      --gold: #b7863c;
      --red: #9e241f;
      --green: #55612f;
      --purple: #6d3f78;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at center top, rgba(255,255,255,.55), transparent 36%),
        radial-gradient(circle at 15% 20%, rgba(183,134,60,.18), transparent 22%),
        linear-gradient(135deg, #f5ead5, var(--paper) 48%, #dbc6a4);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(23,18,14,.12) 1px, transparent 1px),
        radial-gradient(rgba(23,18,14,.08) 1px, transparent 1px);
      background-size: 27px 27px, 11px 11px;
      opacity: .22;
      mix-blend-mode: multiply;
    }

.entry {
  height: 100vh;
  max-height: 100vh;
  display: grid;
  grid-template-rows: 44vh 4vh 52vh;
  justify-items: center;
  align-items: start;
  padding: 1.5vh 3vw 1vh;
  overflow: hidden;
}

    .crane {
    width: 86px;
    height: 66px;
    margin-bottom: 18px;
    animation: craneLand 1.9s cubic-bezier(.2,.9,.2,1) both;
    transform-origin: center;
    }

.logo-stack {
  position: relative;
  width: min(920px, 64vw, 58vh);
  margin: -2.2vh auto 0;
  z-index: 5;
}


 .logo-base {
  width: 100%;
  display: block;
  position: relative;
  z-index: 1;
}

.logo-crane {
  position: absolute;
  width: 58%;
  top: 2%;
  left: 24%;
  z-index: 2;
  transform-origin: 50% 55%;
  animation: craneSpinLand 4.5s cubic-bezier(.18,.85,.22,1) forwards;
}


@keyframes craneSpinLand {
  0% {
    opacity: 0;
    transform:
      translate(0vw, 0vh)
      rotate(0deg)
      scale(5);
  }

  10% {
    opacity: 1;
  }

  100% {
    opacity: 1;
    transform:
      translate(0, 0)
      rotate(1800deg)
      scale(1);
  }
}
    .brand {
      text-align: center;
      animation: fadeUp .9s ease both;
      animation-delay: 1.15s;
    }

    .brand h1 {
      font-size: clamp(3.1rem, 9vw, 7.5rem);
      letter-spacing: .16em;
      font-weight: 400;
      line-height: .9;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    .brand .sub {
      margin-top: 18px;
      color: #7f1d1a;
      font-family: Arial, sans-serif;
      letter-spacing: .48em;
      text-transform: uppercase;
      font-size: clamp(.8rem, 1.5vw, 1.08rem);
    }

    .rule {
      width: min(560px, 78vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 22px auto 18px;
      position: relative;
    }

.tagline {
  font-family: Arial, sans-serif;
  text-transform: uppercase;
  letter-spacing: .42em;
  font-size: clamp(.62rem, 1vw, .9rem);
  color: #2a211a;
  margin: 0;
  animation: fadeUp .9s ease both;
  animation-delay: 4.7s;
}

.doors {
  width: min(980px, 84vw);
  height: 100%;
  display: grid;
  grid-template-columns: .95fr .78fr .95fr;
  grid-template-areas: "tattoo book studio";
  gap: 1.5vw;
  align-items: end;
  justify-items: center;
  margin: -4vh 0 0;
  padding-bottom: 4vh; /* room for floating shadow */
  animation: fadeUp .9s ease both;
  animation-delay: 3.7s;
}

/* BEVELED FLOATING DOOR SHAPE */
.door {
  position: relative;
  display: block;
  width: 100%;
  max-width: 360px;

  background:
    linear-gradient(135deg, rgba(255,255,255,.32), transparent 42%),
    rgba(255,248,232,.42);

  border: none;
  text-decoration: none;
  overflow: hidden;

  clip-path: polygon(
    0 18px,
    18px 0,
    calc(100% - 18px) 0,
    100% 18px,
    100% calc(100% - 18px),
    calc(100% - 18px) 100%,
    18px 100%,
    0 calc(100% - 18px)
  );
  box-shadow:
    inset 0 0 0 2px rgba(23,18,14,.78),
    inset 0 0 0 8px rgba(255,248,232,.58),
    inset 0 0 0 10px rgba(23,18,14,.34),
    inset 0 0 30px rgba(23,18,14,.07),
    0 34px 42px rgba(23,18,14,.26),
    0 14px 18px rgba(23,18,14,.18);

  filter:
    drop-shadow(0 38px 24px rgba(23,18,14,.22))
    drop-shadow(0 12px 8px rgba(23,18,14,.14));

  transition:
    transform .35s ease,
    box-shadow .35s ease,
    filter .35s ease,
    background .35s ease;
}

/* WATER-COLOR / INK SPLATTER BEHIND EACH IMAGE */
.door::after {
  content: "";
  position: absolute;
  width: 62%;
  aspect-ratio: 1.5 / 1;
  top: 10%;
  left: 50%;
  transform: translateX(-50%) rotate(-8deg);
  z-index: 0;
  pointer-events: none;
  opacity: .72;

  background:
    radial-gradient(circle at 22% 46%, rgba(158,36,31,.30) 0 7px, transparent 9px),
    radial-gradient(circle at 36% 31%, rgba(158,36,31,.22) 0 4px, transparent 6px),
    radial-gradient(circle at 58% 40%, rgba(158,36,31,.28) 0 8px, transparent 11px),
    radial-gradient(circle at 72% 58%, rgba(158,36,31,.20) 0 5px, transparent 7px),
    radial-gradient(circle at 44% 55%, rgba(158,36,31,.35) 0%, rgba(158,36,31,.20) 38%, transparent 72%);

  filter: blur(1.2px) saturate(1.05);
  border-radius: 54% 46% 48% 52%;
}
    
/* CLOSED DOUBLE-LINE BEVELED FRAME */
.door::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;

  clip-path: polygon(
    0 18px,
    18px 0,
    calc(100% - 18px) 0,
    100% 18px,
    100% calc(100% - 18px),
    calc(100% - 18px) 100%,
    18px 100%,
    0 calc(100% - 18px)
  );

  box-shadow:
    inset 0 0 0 2px rgba(23,18,14,.82),
    inset 0 0 0 8px rgba(255,248,232,.60),
    inset 0 0 0 10px rgba(23,18,14,.38);
}
    
   .door img,
.door h2,
.door p,
.door span,
.door div {
  position: relative;
  z-index: 1;
}
    
/* SHADOW ON THE IMAGE ITSELF */
.door-art {
  position: absolute;
  z-index: 2;
  pointer-events: none;

  filter:
    drop-shadow(0 12px 12px rgba(23,18,14,.26))
    drop-shadow(0 3px 2px rgba(23,18,14,.24));

  transition:
    transform .35s ease,
    filter .35s ease;
}

.door.book:hover .book-art {
  transform:
    translateX(-50%)
    scale(1.05);
}

/* TATTOO MACHINE POSITION */
.tattoo-art {
  width: 48%;
  top: 8%;
  left: 45%;
  transform:
    translateX(-50%)
    rotate(34deg);
}

.door.tattoo {
  grid-area: tattoo;
  height: min(43vh, 390px);
  --accent: var(--red);
}

.door.book {
  grid-area: book;
  height: min(35vh, 320px);
  --accent: var(--green);
}

.door.studio {
  grid-area: studio;
  height: min(43vh, 390px);
  --accent: var(--purple);
}

/* NEON FRAME GLOW ON HOVER */
.door.tattoo:hover {
  box-shadow:
    inset 0 0 0 2px rgba(255,59,38,.95),
    inset 0 0 0 7px rgba(255,248,232,.55),
    inset 0 0 0 9px rgba(255,59,38,.62),
    inset 0 0 18px rgba(255,59,38,.20),
    0 0 8px rgba(255,59,38,.85),
    0 0 18px rgba(255,59,38,.55),
    0 0 40px rgba(255,59,38,.30),
    0 22px 44px rgba(23,18,14,.22);

  transform: translateY(-6px);
}
    
/* TATTOO MACHINE LIFTS SLIGHTLY ON HOVER */
.door.tattoo:hover .tattoo-art {
  filter:
    drop-shadow(0 18px 24px rgba(23,18,14,.34))
    drop-shadow(0 0 12px rgba(255,59,38,.28));

  transform:
    translateX(-50%)
    rotate(42deg)
    scale(1.05);
}

    .door.book:hover {
      border-color: var(--green);
      box-shadow: 0 0 20px rgba(85,97,47,.44), 0 22px 60px rgba(42, 28, 16, .18);
    }

 
    .door.studio:hover {
      border-color: var(--purple);
      box-shadow: 0 0 20px rgba(109,63,120,.48), 0 22px 60px rgba(42, 28, 16, .18);
    }


.icon {
  width: clamp(72px, 6vw, 118px);
  height: clamp(72px, 6vw, 118px);
  margin-bottom: 1.2vh;
}
.door.book .icon {
  width: 126px;
  height: 126px;
}
    .door:hover .icon {
      transform: scale(1.06) rotate(-2deg);
      filter: drop-shadow(0 0 8px var(--accent));
    }

 .door h2 {
  font-size: clamp(1.3rem, 2vw, 2.2rem);
}

 .copy {
  margin-top: 1.2vh;
  font-size: clamp(.78rem, .9vw, .98rem);
  line-height: 1.55;
}

.enter {
  min-width: unset;
  width: 82%;
  padding: 10px 12px;
  font-size: .78rem;
}

.door:hover .enter {
  letter-spacing: .34em;
  transform: translateY(-2px);
}
    .book-art {
  width: 46%;
  top: 18%;
  left: 50%;
  transform: translateX(-50%);
}

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

@media (max-width: 900px) {
  .entry {
    height: auto;
    min-height: 100vh;
    overflow: visible;
    padding: 28px 18px 42px;
  }

  .logo-stack {
    width: min(340px, 82vw);
    margin-bottom: 12px;
  }

  .doors {
    grid-template-columns: 1fr;
    max-height: none;
    gap: 18px;
    margin-top: 24px;
  }

  .door,
  .door.book {
    height: auto;
    transform: none;
  }
}
  </style>
</head>

</div>
