<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperCrane Books & Tattoo</title>
  <style>
    :root {
      --paper: #efe2c6;
      --paper-deep: #d8c39d;
      --ink: #17120e;
      --muted: #6f5d48;
      --gold: #b7863c;
      --red: #9e241f;
      --green: #55612f;
      --purple: #6d3f78;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

body {
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  color: #efe3c7;

  background: #050505;

  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(rgba(255,238,198,.08) 1px, transparent 1px);
  background-size: 18px 18px;
  opacity: .16;
  mix-blend-mode: screen;
}

.entry {
  min-height: 100svh;
  display: grid;
  grid-template-rows: 38vh 62vh;
  justify-items: center;
  align-items: center;
  padding: clamp(12px, 2vh, 24px) 3vw clamp(14px, 2vh, 24px);
  overflow: visible;
}

    .crane {
    width: 86px;
    height: 66px;
    margin-bottom: 18px;
    animation: craneLand 1.9s cubic-bezier(.2,.9,.2,1) both;
    transform-origin: center;
    }

.logo-stack {
  position: relative;
  width: min(1040px, 82vw, 42vh);
  margin: 0 auto;
  z-index: 5;
  align-self: center;
}


 .logo-base {
  width: 100%;
  display: block;
  position: relative;
  z-index: 1;
}

.logo-crane {
  position: absolute;
  width: 58%;
  top: 2%;
  left: 26%;
  z-index: 2;
  transform-origin: 50% 55%;
  animation: craneSpinLand 4.5s cubic-bezier(.18,.85,.22,1) forwards;
}


@keyframes craneSpinLand {
  0% {
    opacity: 0;
    transform:
      translate(0vw, 0vh)
      rotate(0deg)
      scale(5);
  }

  8% {
    opacity: .45;
  }

  18% {
    opacity: .85;
  }

  28% {
    opacity: 1;
  }

  100% {
    opacity: 1;
    transform:
      translate(0, 0)
      rotate(1800deg)
      scale(1);
  }
}
    .brand {
      text-align: center;
      animation: fadeUp .9s ease both;
      animation-delay: 1.15s;
    }

    .brand h1 {
      font-size: clamp(3.1rem, 9vw, 7.5rem);
      letter-spacing: .16em;
      font-weight: 400;
      line-height: .9;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    .brand .sub {
      margin-top: 18px;
      color: #7f1d1a;
      font-family: Arial, sans-serif;
      letter-spacing: .48em;
      text-transform: uppercase;
      font-size: clamp(.8rem, 1.5vw, 1.08rem);
    }

    .rule {
      width: min(560px, 78vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 22px auto 18px;
      position: relative;
    }

.tagline {
  font-family: Arial, sans-serif;
  text-transform: uppercase;
  letter-spacing: .42em;
  font-size: clamp(.62rem, 1vw, .9rem);
  color: #2a211a;
  margin: 0;
  animation: fadeUp .9s ease both;
  animation-delay: 4.7s;
}
/* =========================================================
   DOOR LAYOUT — IMAGE-BASED VERSION
   The frame is now an image asset: Images/door.png
========================================================= */

.doors {
  width: min(1120px, 90vw);
  display: grid;
  grid-template-columns: repeat(3, minmax(220px, 300px));
  grid-template-areas: "tattoo book studio";
  justify-content: center;
  align-items: end;
  justify-items: center;
  gap: clamp(28px, 4vw, 64px);
  margin: 0;
  padding-bottom: clamp(10px, 2vh, 24px);
  overflow: visible;
  animation: fadeUp .9s ease both;
  animation-delay: 3.7s;
}

.door-wrap {
  position: relative;
  width: 100%;
  max-width: 300px;
  aspect-ratio: 4 / 5.65;
  overflow: visible;
}

.tattoo-wrap {
  grid-area: tattoo;
}

.book-wrap {
  grid-area: book;
}

.studio-wrap {
  grid-area: studio;
}

.door {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  text-decoration: none;
  transform: translateY(0);
  transition:
    transform .35s ease,
    filter .35s ease;
}

.door-frame {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  pointer-events: none;
  filter:
    drop-shadow(0 14px 18px rgba(0,0,0,.45))
    drop-shadow(0 0 10px rgba(183,134,60,.12));
  transition: filter .35s ease;
}

.door:hover {
  transform: translateY(-8px);
}

.door:hover .door-frame {
  filter:
    drop-shadow(0 18px 26px rgba(0,0,0,.55))
    drop-shadow(0 0 18px var(--glow));
}

/* Shared interior artwork */
.door-art {
  position: absolute;
  z-index: 2;
  pointer-events: none;
  transition:
    transform .35s ease,
    filter .35s ease;
  filter:
    drop-shadow(0 12px 12px rgba(23,18,14,.32));
}

/* Tattoo machine */
.tattoo-art {
  width: 50%;
  top: 22%;
  left: 50%;
  transform: translateX(-50%) rotate(32deg);
}

.door.tattoo:hover .tattoo-art {
  transform: translateX(-50%) rotate(40deg) scale(1.05);
  filter:
    drop-shadow(0 16px 18px rgba(23,18,14,.38))
    drop-shadow(0 0 8px rgba(158,36,31,.42));
}

/* Book */
.book-art {
  width: 48%;
  top: 24%;
  left: 50%;
  transform: translateX(-50%);
}

.door.book:hover .book-art {
  transform: translateX(-50%) scale(1.05);
  filter:
    drop-shadow(0 16px 18px rgba(23,18,14,.38))
    drop-shadow(0 0 8px rgba(85,97,47,.38));
}

/* Keyhole for private studio */
.keyhole-art {
  position: absolute;
  z-index: 2;
  width: 34%;
  top: 26%;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  filter:
    drop-shadow(0 10px 12px rgba(0,0,0,.42));
  transition:
    transform .35s ease,
    filter .35s ease;
}

.door.studio:hover .keyhole-art {
  transform: translateX(-50%) scale(1.06);
  filter:
    drop-shadow(0 12px 16px rgba(0,0,0,.50))
    drop-shadow(0 0 12px rgba(109,63,120,.55));
}

/* Door-specific glow colors */
.door.tattoo {
  --glow: rgba(158,36,31,.55);
}

.door.book {
  --glow: rgba(85,97,47,.50);
}

.door.studio {
  --glow: rgba(109,63,120,.55);
}

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

@media (max-width: 900px) {
  .entry {
    height: auto;
    min-height: 100vh;
    overflow: visible;
    padding: 28px 18px 42px;
  }

  .logo-stack {
    width: min(340px, 82vw);
    margin-bottom: 12px;
  }

.doors {
  width: min(340px, 86vw);
  grid-template-columns: 1fr;
  grid-template-areas:
    "tattoo"
    "book"
    "studio";
  gap: 22px;
  margin-top: 24px;
}

.door-wrap {
  max-width: 300px;
}

.door {
  transform: none;
}
}
  </style>
</head>
<body>
  <main class="entry">
   <div class="logo-stack">
  <img src="Images/logo-base.png" class="logo-base" alt="PaperCrane Books & Tattoo logo">
  <img src="Images/logo-crane.png" class="logo-crane" alt="">
</div>


<section class="doors" aria-label="Choose where to enter">

  <div class="door-wrap tattoo-wrap">
    <a class="door tattoo" href="tattoo.html">
      <img src="Images/door.png"
           class="door-frame"
           alt=""
           aria-hidden="true">

      <img src="Images/gun.png"
           class="door-art tattoo-art"
           alt="Coil tattoo machine">
    </a>
  </div>

  <div class="door-wrap book-wrap">
    <a class="door book" href="bookstore.html">
      <img src="Images/door.png"
           class="door-frame"
           alt=""
           aria-hidden="true">

      <img src="Images/book.png"
           class="door-art book-art"
           alt="Open book illustration">
    </a>
  </div>

  <div class="door-wrap studio-wrap">
    <a class="door studio" href="studio.html">
      <img src="Images/door.png"
           class="door-frame"
           alt=""
           aria-hidden="true">

      <img src="Images/keyhole.png"
           class="keyhole-art"
           alt="Private studio keyhole">
    </a>
  </div>

</section>
      
  </main>
</body>
</html>
